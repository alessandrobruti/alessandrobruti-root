<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accesso riservato</title>
<style>
:root{
  --paper:#F3F4F1;--ink:#15232C;--surface:#FFFFFF;--teal:#137A6F;--teal-d:#0E5B53;
  --signal:#C24B16;--muted:#5C6B72;--line:#E2E6E1;--grid:#ECEEE9;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
}
.card{
  background:var(--surface);border:1px solid var(--line);padding:36px 40px;
  width:100%;max-width:380px;
}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--teal-d);font-weight:600;margin-bottom:8px;
}
h1{font-size:22px;font-weight:800;margin:0 0 24px;letter-spacing:-.02em}
label{
  display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;
}
input[type=password]{
  width:100%;border:1px solid var(--line);background:var(--paper);
  padding:10px 12px;font-size:15px;font-family:var(--sans);color:var(--ink);
  outline:none;margin-bottom:16px;
}
input[type=password]:focus{border-color:var(--teal)}
button{
  width:100%;background:var(--ink);color:#fff;border:0;padding:12px;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;cursor:pointer;
}
button:hover{background:var(--teal-d)}
.error{
  font-family:var(--mono);font-size:12px;color:var(--signal);margin-bottom:14px;
  display:none;
}
.error.show{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>Accesso riservato</h1>
  <div class="error" id="err">Password non corretta.</div>
  <form method="POST" action="/api/login">
    <label for="pwd">Password</label>
    <input type="password" id="pwd" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">Accedi</button>
  </form>
</div>
<script>
  if (location.search.includes('error=1')) {
    document.getElementById('err').classList.add('show')
  }
</script>
</body>
</html>
